        <div id="center">
        <h1>Arbetserfarenheter</h1>
        <p>Fyll i uppgifterna nedan. Företag och namnet på positionen är obligatoriska att fylla i.</p>
        <p>Datum är frivilliga att lägga till och beskrivning är frivilligt (du kanske jobbar än, eller inte vill beskriva/vet hur du ska beskriva?)</p>
        <br>
        <div id="add-err"></div>
        <form id="workForm">
            <label for="company">Företaget</label>
            <input type="text" id="company" placeholder="Företaget...">

            <label for="jobtitle">Namn på position/din roll</label>
            <input type="text" id="jobtitle" placeholder="Namn på arbetet...">

            <label for="start_date">Började arbeta:</label>
            <input type="date" id="start_date">

            <label for="end_date">Slutade arbeta:</label>
            <input type="date" id="end_date">

            <label for="description">Beskrivning:</label>
            <input type="text" id="description" placeholder="Beskriv arbetet...">
            
            <button type="submit">Spara</button>
        </form>

        </div>
    </main>
